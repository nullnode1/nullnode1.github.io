<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Açık kaynak, yazılım ve kişisel notlar.">
  <meta name="theme-color" content="#ffffff">
  <title>nullnode1 — Blog</title>

  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2">
  <link rel="alternate" type="application/rss+xml" title="nullnode1 Blog RSS" href="/rss.xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="./assets/blog.css">
  <link rel="stylesheet" href="./assets/search.css">

  <style>
    /* Docsify'nin uzun yazılarda footer üzerine binmesini engelle. */
    html { height: auto !important; min-height: 100% !important; }
    body {
      height: auto !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      display: flex !important;
      flex-direction: column !important;
    }
    body > .site-header { flex: 0 0 auto !important; }
    body > #app {
      position: relative !important;
      flex: 1 0 auto !important;
      display: block !important;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
    }
    #app main, #app .content, #app .markdown-section {
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
    }
    #app main, #app .content {
      position: relative !important;
      top: auto !important;
      bottom: auto !important;
    }
    body > .site-footer {
      position: relative !important;
      top: auto !important;
      bottom: auto !important;
      flex: 0 0 auto !important;
      margin-top: auto !important;
      width: 100%;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-title" href="#/">nullnode1<span aria-hidden="true">.</span></a>
      <form class="site-search" id="site-search-form" role="search" autocomplete="off">
        <label class="visually-hidden" for="site-search-input">Blog yazılarında ara</label>
        <input id="site-search-input" type="search" name="q" placeholder="Yazılarda ara..." aria-controls="site-search-results" aria-expanded="false" minlength="2" maxlength="100">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square">
          <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path>
        </svg>
        <div class="search-results" id="site-search-results" role="status" aria-live="polite" hidden></div>
      </form>
      <nav class="site-nav" aria-label="Ana menü">
        <a href="#/">Yazılar</a>
        <a href="#/hakkimda">Hakkımda</a>
        <a href="https://github.com/nullnode1" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <div id="app" aria-live="polite">Yazılar yükleniyor…</div>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>© 2026 · Kişisel notlar</span>
      <span><a href="/rss.xml">RSS</a> · Markdown ile hazırlandı.</span>
    </div>
  </footer>

  <script src="./assets/blog.js"></script>
  <script src="./assets/search.js" defer></script>
  <script>
    window.$docsify = {
      name: 'Notlar',
      homepage: 'README.md',
      routerMode: 'hash',
      relativePath: false,
      loadSidebar: false,
      hideSidebar: true,
      loadNavbar: false,
      coverpage: false,
      maxLevel: 0,
      subMaxLevel: 0,
      auto2top: true,
      themeColor: '#171717',
      plugins: [window.blogPostPlugin]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
