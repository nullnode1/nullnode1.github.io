name: Blogu yayinla (arama, RSS ve sitemap)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kaynak dosyalarini indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Markdown kutuphanesini kur
        run: python -m pip install --disable-pip-version-check 'Markdown>=3.8,<4'

      - name: Siteyi, RSS ve sitemap dosyalarini olustur
        run: python tools/generate.py

      - name: GitHub Pages hazirla
        uses: actions/configure-pages@v5

      - name: Site dosyalarini yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Siteyi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
